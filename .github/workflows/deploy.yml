name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anywork365-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted SSH access
        env:
          DEPLOY_KEY: ${{ secrets.ANYWORK365_DEPLOY_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy committed master to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            anyworkdeploy@"$VPS_HOST" "deploy $GITHUB_SHA"
